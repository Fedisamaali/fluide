name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t fluide .

      - name: Lancer le conteneur
        run: docker run -d --name fluide -p 8080:80 fluide

      - name: Vérifier que la page et ses scripts sont servis
        run: |
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "<title>Fluide"
          for f in style.css src/shaders.js src/gl.js src/fluid.js src/palettes.js src/text.js src/audio.js src/ui.js src/main.js; do
            curl -fsS -o /dev/null "http://localhost:8080/$f"
          done
          curl -fsSI http://localhost:8080/src/main.js | grep -qi "content-type: application/javascript"

      - name: Journaux du conteneur
        if: always()
        run: docker logs fluide

  multi-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construire pour Intel et Apple Silicon
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
