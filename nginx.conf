server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
